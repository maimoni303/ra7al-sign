name: Test & publish RA7AL Sign

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Server tests (mock Apple API + stand-in signer)
        run: node --test --test-timeout=120000 tests/server.test.mjs
      - name: UI tests (mobile browser)
        run: |
          pip install playwright==1.* >/dev/null && python -m playwright install --with-deps chromium >/dev/null
          python tests/test_ui.py

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build (amd64) and smoke-test the real image
        uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: ra7al-sign:test, platforms: linux/amd64, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Smoke test — real zsign, openssl, server
        run: |
          docker run --rm --entrypoint zsign ra7al-sign:test -v
          docker run --rm --entrypoint openssl ra7al-sign:test version
          docker run -d --name t -p 8787:8787 ra7al-sign:test
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/ping && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/ | grep -q "رحّال للتوقيع"
          docker logs t
      - name: Push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/ra7al-sign:latest
            ghcr.io/${{ github.repository_owner }}/ra7al-sign:1.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
